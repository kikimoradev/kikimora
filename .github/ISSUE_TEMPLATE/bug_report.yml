name: Bug report
description: Something in kikimora does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: Steps to reproduce, relevant `settings.json` values, and the shape of your prompts. Redact anything private.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output, such as headless line logs, a fragment of a session log from `.kikimora/logs/`, or `kikimora status --json`. Redact anything private.
      render: text
  - type: input
    id: version
    attributes:
      label: Kikimora version
      placeholder: "0.7.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version, Claude Code version, TUI or headless
      placeholder: macOS 15, Node 22.16, Claude Code 2.x, TUI
    validations:
      required: true
